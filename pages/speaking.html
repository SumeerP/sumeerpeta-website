<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaking Engagements — Sumeer Peta</title>
  <meta name="description" content="Sumeer Basha Peta's speaking engagements at international academic conferences on smart technology, AI, and wireless communications.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    .speaking-section {
      margin-bottom: var(--space-12);
    }
    .speaking-section__title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      margin-bottom: var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .speaking-section__title-accent {
      width: 4px;
      height: 28px;
      background: var(--color-accent-gradient);
      border-radius: var(--radius-full);
    }
    .speaking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: var(--space-6);
    }
    .speaking-card {
      display: flex;
      align-items: flex-start;
      gap: var(--space-5);
      padding: var(--space-6) var(--space-8);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }
    .speaking-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--color-accent-gradient);
      border-radius: var(--radius-full) 0 0 var(--radius-full);
    }
    .speaking-card:hover {
      border-color: var(--color-border-hover);
      box-shadow: var(--shadow-lg);
      transform: translateY(-4px);
    }
    .speaking-card__icon {
      font-size: 2rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .speaking-card__content {
      flex: 1;
    }
    .speaking-card__event {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-text-heading);
      margin-bottom: var(--space-2);
      line-height: 1.4;
    }
    .speaking-card__year {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 3px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      background: rgba(230, 126, 34, 0.12);
      color: var(--color-accent-primary);
    }

    @media (max-width: 480px) {
      .speaking-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="page-content" id="speaking-content"></main>

  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="../js/data/siteData.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/pageHeader.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/main.js"></script>
  <script>
    renderNavbar('navbar-root', 'pages/speaking.html');
    renderPageHeader('page-header-root', {
      title: 'Speaking Engagements',
      subtitle: 'Invited speaker at international academic conferences on emerging technology, AI, and communications.',
    });
    renderFooter('footer-root', true);

    (function() {
      const container = document.getElementById('speaking-content');
      const { speaker } = siteData;

      const cardsHtml = speaker.map((s, i) => `
        <div class="speaking-card reveal" style="transition-delay: ${i * 0.1}s">
          <span class="speaking-card__icon">${s.icon || '🎤'}</span>
          <div class="speaking-card__content">
            <h3 class="speaking-card__event">${s.event}</h3>
            <span class="speaking-card__year">📅 ${s.year}</span>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="speaking-section">
          <h2 class="speaking-section__title reveal">
            <span class="speaking-section__title-accent"></span>
            Conference Speaking
          </h2>
          <div class="speaking-grid">
            ${cardsHtml}
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
