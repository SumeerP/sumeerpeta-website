<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awards & Recognition — Sumeer Peta</title>
  <meta name="description" content="Awards and recognitions earned by Sumeer Basha Peta including Globee Gold, Titan Gold, and Golden Bridge awards for technology leadership and customer excellence.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    .awards-category {
      margin-bottom: var(--space-10);
    }
    .awards-category__title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-3);
      border-bottom: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .award-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-6);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-3);
      transition: all var(--transition-base);
    }
    .award-item:hover {
      border-color: var(--color-border-hover);
      transform: translateX(4px);
      box-shadow: var(--shadow-md);
    }
    .award-item__name {
      font-weight: var(--weight-medium);
      color: var(--color-text-primary);
      font-size: var(--text-base);
    }
    .award-item__badge {
      display: inline-flex;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .award-item__badge--gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
    }
    .award-item__badge--silver {
      background: linear-gradient(135deg, #9ca3af, #6b7280);
      color: #fff;
    }
    .award-item__badge--bronze {
      background: linear-gradient(135deg, #b45309, #92400e);
      color: #fff;
    }
    .award-item__badge--platinum {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
    }
    @media (max-width: 600px) {
      .award-item {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-2);
      }
    }
  </style>
</head>
<body>
  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="page-content" id="awards-content"></main>

  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="../js/data/siteData.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/pageHeader.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/main.js"></script>
  <script>
    renderNavbar('navbar-root', 'pages/awards.html');
    renderPageHeader('page-header-root', {
      title: 'Awards & Recognition',
      subtitle: 'Honors for technology leadership, customer excellence, and technical innovation.',
    });
    renderFooter('footer-root', true);

    // Render categorized awards
    (function() {
      const container = document.getElementById('awards-content');
      const { awards } = siteData;

      // Count total awards
      const totalAwards = awards.categories.reduce((sum, cat) => sum + cat.items.length, 0);

      // Stats bar
      const statsHtml = `
        <div class="stats-bar reveal">
          <div class="stat">
            <div class="stat__value">${totalAwards}</div>
            <div class="stat__label">Total Awards</div>
          </div>
          <div class="stat">
            <div class="stat__value">${awards.categories.reduce((sum, cat) => sum + cat.items.filter(a => a.level === 'Gold').length, 0)}</div>
            <div class="stat__label">Gold Awards</div>
          </div>
          <div class="stat">
            <div class="stat__value">${awards.categories.length}</div>
            <div class="stat__label">Award Programs</div>
          </div>
        </div>
      `;

      const categoriesHtml = awards.categories.map((cat, ci) => {
        const items = cat.items.map((award, i) => {
          const badgeClass = award.level ? `award-item__badge--${award.level.toLowerCase()}` : '';
          return `
            <div class="award-item reveal" style="transition-delay: ${(ci * 0.05) + (i * 0.04)}s">
              <span class="award-item__name">${award.name}</span>
              ${award.level ? `<span class="award-item__badge ${badgeClass}">${award.level}</span>` : ''}
            </div>
          `;
        }).join('');

        return `
          <div class="awards-category reveal" style="transition-delay: ${ci * 0.1}s">
            <h2 class="awards-category__title">🏆 ${cat.name}</h2>
            ${items}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        ${statsHtml}
        ${categoriesHtml}
      `;
    })();
  </script>
</body>
</html>
