<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memberships & Mentoring — Sumeer Peta</title>
  <meta name="description" content="Sumeer Basha Peta's professional memberships (IEEE Senior Member, Fellow of BCS, IETE, SCRS) and mentoring activities.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    .membership-section {
      margin-bottom: var(--space-12);
    }
    .membership-section__title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      margin-bottom: var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .membership-section__title-accent {
      width: 4px;
      height: 28px;
      background: var(--color-accent-gradient);
      border-radius: var(--radius-full);
    }
    .membership-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .membership-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-5) var(--space-6);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      transition: all var(--transition-base);
    }
    .membership-card:hover {
      border-color: var(--color-border-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .membership-card__icon {
      font-size: 2rem;
      flex-shrink: 0;
    }
    .membership-card__content {
      min-width: 0;
    }
    .membership-card__org {
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      font-size: var(--text-base);
    }
    .membership-card__role {
      font-size: var(--text-sm);
      color: var(--color-accent-primary);
      font-weight: var(--weight-medium);
    }
    .mentor-card {
      padding: var(--space-6);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      transition: all var(--transition-base);
    }
    .mentor-card:hover {
      border-color: var(--color-border-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .mentor-card__header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }
    .mentor-card__icon {
      font-size: 1.5rem;
    }
    .mentor-card__name {
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      font-size: var(--text-lg);
    }
    .mentor-card__desc {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      line-height: var(--leading-relaxed);
    }
  </style>
</head>
<body>
  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="page-content" id="mentoring-content"></main>

  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="../js/data/siteData.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/pageHeader.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/main.js"></script>
  <script>
    renderNavbar('navbar-root', 'pages/mentoring.html');
    renderPageHeader('page-header-root', {
      title: 'Memberships & Mentoring',
      subtitle: 'Professional society memberships and mentoring contributions to the technology community.',
    });
    renderFooter('footer-root', true);

    (function() {
      const container = document.getElementById('mentoring-content');
      const { memberships, mentoring } = siteData;

      // Fellow memberships
      const fellowCards = memberships.fellow.map((org, i) => `
        <div class="membership-card reveal" style="transition-delay: ${i * 0.08}s">
          <span class="membership-card__icon">🏅</span>
          <div class="membership-card__content">
            <div class="membership-card__org">${org}</div>
            <div class="membership-card__role">Fellow</div>
          </div>
        </div>
      `).join('');

      // Senior member
      const seniorCards = memberships.seniorMember.map((org, i) => `
        <div class="membership-card reveal" style="transition-delay: ${(i + memberships.fellow.length) * 0.08}s">
          <span class="membership-card__icon">⭐</span>
          <div class="membership-card__content">
            <div class="membership-card__org">${org}</div>
            <div class="membership-card__role">Senior Member</div>
          </div>
        </div>
      `).join('');

      // Mentoring cards
      const mentorCards = mentoring.map((m, i) => `
        <div class="mentor-card reveal" style="transition-delay: ${i * 0.1}s">
          <div class="mentor-card__header">
            <span class="mentor-card__icon">${m.icon}</span>
            <span class="mentor-card__name">${m.name}</span>
          </div>
          <p class="mentor-card__desc">${m.description}</p>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="membership-section">
          <h2 class="membership-section__title">
            <span class="membership-section__title-accent"></span>
            Fellow Memberships
          </h2>
          <div class="membership-grid">${fellowCards}</div>
        </div>

        <div class="membership-section">
          <h2 class="membership-section__title">
            <span class="membership-section__title-accent"></span>
            Senior Memberships
          </h2>
          <div class="membership-grid">${seniorCards}</div>
        </div>

        <div class="membership-section">
          <h2 class="membership-section__title">
            <span class="membership-section__title-accent"></span>
            Mentoring
          </h2>
          <div class="membership-grid" style="grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));">
            ${mentorCards}
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
