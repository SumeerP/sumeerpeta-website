<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications — Sumeer Peta</title>
  <meta name="description" content="Research publications by Sumeer Basha Peta — 42+ citations, h-index 4. Research in AI, federated learning, healthcare, cloud architectures, and CMS personalization. Book author.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    .pub-section-title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      margin: var(--space-10) 0 var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .pub-section-title__accent {
      width: 4px;
      height: 28px;
      background: var(--color-accent-gradient);
      border-radius: var(--radius-full);
    }
    .recognition-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-bottom: var(--space-10);
    }
    .recognition-item {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-6);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      border-left: 3px solid var(--color-accent-warm);
      transition: all var(--transition-base);
    }
    .recognition-item:hover {
      border-color: var(--color-border-hover);
      box-shadow: var(--shadow-md);
      transform: translateX(4px);
    }
    .recognition-item__icon { font-size: 1.2rem; }
    .recognition-item__text {
      color: var(--color-text-primary);
      font-weight: var(--weight-medium);
    }
    .book-card {
      display: flex;
      align-items: center;
      gap: var(--space-6);
      padding: var(--space-8);
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      margin-bottom: var(--space-10);
      transition: all var(--transition-base);
    }
    .book-card:hover {
      border-color: var(--color-border-hover);
      box-shadow: var(--shadow-lg);
    }
    .book-card__icon { font-size: 3rem; }
    .book-card__title {
      font-family: var(--font-heading);
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--color-text-heading);
      margin-bottom: var(--space-2);
    }
    .book-card__text {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
    }
    .role-badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      background: rgba(230, 126, 34, 0.1);
      color: var(--color-accent-primary);
      margin-left: var(--space-2);
    }
  </style>
</head>
<body>
  <div id="navbar-root"></div>
  <div id="page-header-root"></div>

  <main class="page-content" id="publications-content"></main>

  <div id="footer-root"></div>

  <!-- Scripts -->
  <script src="../js/data/siteData.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/pageHeader.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/main.js"></script>
  <script>
    renderNavbar('navbar-root', 'pages/publications.html');
    renderPageHeader('page-header-root', {
      title: 'Research & Publications',
      subtitle: 'Peer-reviewed research in AI, cloud computing, healthcare, and digital transformation.',
    });
    renderFooter('footer-root', true);

    (function() {
      const container = document.getElementById('publications-content');
      const { publications } = siteData;

      // Stats bar
      const statsHtml = `
        <div class="stats-bar reveal">
          <div class="stat">
            <div class="stat__value">${publications.stats.totalCitations}</div>
            <div class="stat__label">Total Citations</div>
          </div>
          <div class="stat">
            <div class="stat__value">${publications.stats.hIndex}</div>
            <div class="stat__label">h-index</div>
          </div>
          <div class="stat">
            <div class="stat__value">${publications.stats.i10Index}</div>
            <div class="stat__label">i10-index</div>
          </div>
          <div class="stat">
            <div class="stat__value">${publications.papers.length}</div>
            <div class="stat__label">Publications</div>
          </div>
        </div>
      `;

      // Book author card
      const bookHtml = publications.bookAuthor ? `
        <div class="book-card reveal">
          <span class="book-card__icon">📘</span>
          <div>
            <h3 class="book-card__title">${publications.bookAuthor.title}</h3>
            <p class="book-card__text">${publications.bookAuthor.description}</p>
            <a href="${publications.bookAuthor.link}" class="btn btn--primary" target="_blank" rel="noopener noreferrer">${publications.bookAuthor.linkText}</a>
          </div>
        </div>
      ` : '';

      // Recognition section
      const recognitionHtml = publications.recognition && publications.recognition.length ? `
        <h2 class="pub-section-title reveal">
          <span class="pub-section-title__accent"></span>
          Published Material Recognition
        </h2>
        <div class="recognition-list">
          ${publications.recognition.map((r, i) => `
            <div class="recognition-item reveal" style="transition-delay: ${i * 0.06}s">
              <span class="recognition-item__icon">🏅</span>
              <span class="recognition-item__text">${r}</span>
            </div>
          `).join('')}
        </div>
      ` : '';

      // Paper cards
      const papersHtml = publications.papers.map((paper, i) => {
        const tags = paper.tags
          ? paper.tags.map(t => `<span class="info-card__tag">${t}</span>`).join(' ')
          : '';
        const roleBadge = paper.role ? `<span class="role-badge">${paper.role}</span>` : '';

        return `
          <div class="info-card reveal" style="transition-delay: ${i * 0.06}s">
            <div class="info-card__icon">📄</div>
            <h3 class="info-card__title">${paper.title}${roleBadge}</h3>
            <p class="info-card__subtitle">${paper.authors}</p>
            <p class="info-card__text">${paper.venue}</p>
            <div class="info-card__meta">
              <span>📅 ${paper.year}</span>
              <span>📊 ${paper.citations} citations</span>
            </div>
            ${tags ? `<div style="margin-top: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-2);">${tags}</div>` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        ${statsHtml}
        ${bookHtml}
        ${recognitionHtml}
        <h2 class="pub-section-title reveal">
          <span class="pub-section-title__accent"></span>
          Conference & Journal Papers
        </h2>
        <div class="card-grid">
          ${papersHtml}
        </div>
      `;
    })();
  </script>
</body>
</html>
